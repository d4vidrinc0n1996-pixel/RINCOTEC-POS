# Publica la app de mostacillas en GitHub Pages:
# https://d4vidrinc0n1996-pixel.github.io/RINCOTEC-POS/
# Requiere activar Pages una vez: Settings → Pages → Source: "GitHub Actions".
name: Publicar mostacillas en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['mostacillas/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Si Pages no está activado todavía, termina sin error y lo avisa
      - name: Revisar si GitHub Pages está activado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages no está activado. Actívalo en Settings → Pages → Source: GitHub Actions."
          fi

      - name: Preparar archivos de la app
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir _site
          cp -r mostacillas/. _site/
          rm -f _site/README.md _site/netlify.toml

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
