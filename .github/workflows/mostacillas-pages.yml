# Publica la app de mostacillas en GitHub Pages:
# https://d4vidrinc0n1996-pixel.github.io/RINCOTEC-POS/
# Requiere activar Pages una vez: Settings → Pages → Source: "GitHub Actions".
name: Publicar mostacillas en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['mostacillas/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar archivos de la app
        run: |
          mkdir _site
          cp -r mostacillas/. _site/
          rm -f _site/README.md _site/netlify.toml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
