<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vectorizador de imágenes - RINCOTEC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Vectorizador de imágenes</h1>
    <p>Convierte una imagen en contornos vectoriales para CAD, láser o CNC (DXF / SVG). Todo se procesa en tu navegador.</p>
  </header>

  <main>
    <aside class="panel">
      <label id="drop" class="drop" tabindex="0">
        <input type="file" id="file" accept="image/*" hidden>
        <strong>Arrastra una imagen</strong><span>o haz clic para elegir (también puedes pegar con Ctrl+V)</span>
      </label>

      <fieldset>
        <legend>Trazado</legend>
        <label>Modo
          <select id="mode">
            <option value="bw">Blanco y negro (una capa)</option>
            <option value="color">Varios colores (una capa por color)</option>
          </select>
        </label>
        <div id="bwOpts">
          <label class="row"><input type="checkbox" id="auto" checked> Umbral automático <output id="thrOut"></output></label>
          <label>Umbral <input type="range" id="thr" min="1" max="254" value="128" disabled></label>
          <label class="row"><input type="checkbox" id="invert"> Invertir (trazar zonas claras)</label>
        </div>
        <div id="colorOpts" hidden>
          <label>Número de colores <input type="range" id="colors" min="2" max="12" value="4"><output></output></label>
          <label class="row"><input type="checkbox" id="ignoreBg" checked> Ignorar el color de fondo</label>
          <ul id="swatches" class="swatches"></ul>
        </div>
        <label>Suavizado <input type="range" id="blur" min="0" max="6" value="1"><output></output></label>
        <label>Simplificación <input type="range" id="tol" min="0" max="5" step="0.1" value="0.8"><output></output></label>
        <label>Ignorar manchas menores a <input type="range" id="minArea" min="0" max="500" step="5" value="20"><output></output></label>
      </fieldset>

      <fieldset>
        <legend>Exportación</legend>
        <label>Ancho final (mm) <input type="number" id="widthMm" value="100" min="1" step="1"></label>
        <label id="layerLbl">Capa DXF <input type="text" id="layer" value="CORTE"></label>
        <div class="btns">
          <button id="dxf" disabled>Descargar DXF</button>
          <button id="svg" disabled class="secondary">Descargar SVG</button>
        </div>
        <p id="stats" class="stats">Sin imagen cargada.</p>
      </fieldset>
    </aside>

    <section class="views">
      <figure><figcaption>Original</figcaption><canvas id="orig"></canvas></figure>
      <figure><figcaption>Vector</figcaption><div id="vec" class="vec"></div></figure>
    </section>
  </main>

  <script src="js/vectorize.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
