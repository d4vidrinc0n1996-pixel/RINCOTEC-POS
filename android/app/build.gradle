plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rincotec.mostacillas'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rincotec.mostacillas'
        minSdk 24
        targetSdk 34
        // En GitHub Actions se usa el número de ejecución para que cada APK sea una actualización
        versionCode Integer.parseInt(System.getenv('APK_VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('APK_VERSION_CODE') ?: '0')
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // La app web se toma directamente de la carpeta mostacillas/ del repositorio
    sourceSets {
        main {
            assets.srcDirs = ['../../mostacillas']
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!README.md:!netlify.toml:!sw.js:!404.html:!manifest.webmanifest'
    }
}
